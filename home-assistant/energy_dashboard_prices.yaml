# DK1 / Stromligning pricing package for the Energy Dashboard.
#
# Install to:
#   /config/packages/energy_dashboard_prices.yaml
#
# Do not load this together with the legacy combined
# `energy-dashboard-hakit.yaml` package.

command_line:
  - sensor:
      name: Energy Dashboard Peak Rates
      unique_id: energy_dashboard_peak_rates
      command: >-
        python3 -c "import json, urllib.request; url='http://ENERGY_PRICE_PROXY_HOST:1000/'; data=json.load(urllib.request.urlopen(url, timeout=15)); print(json.dumps({'count': len(data) if isinstance(data, list) else 0, 'prices': data if isinstance(data, list) else data.get('prices', data.get('windows', data.get('rates', []))) }))"
      value_template: "{{ value_json.count }}"
      json_attributes:
        - prices
      scan_interval: 900

# Predbat consumes detailed rate intervals from separate entities for the
# current and next calendar day. These template sensors reuse the dashboard's
# cached `prices` attribute, so Home Assistant does not make extra proxy calls.
template:
  - sensor:
      - name: Stromligning Import Today
        unique_id: stromligning_import_today
        unit_of_measurement: "DKK/kWh"
        state_class: measurement
        icon: mdi:currency-dkk
        availability: >-
          {{ state_attr('sensor.energy_dashboard_peak_rates', 'prices') is not none }}
        state: >-
          {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
          {% set now_ts = now().timestamp() %}
          {% set ns = namespace(current=none) %}
          {% for item in prices %}
            {% set start = as_datetime(item.get('start')) %}
            {% set end = as_datetime(item.get('end')) %}
            {% if start and end and start.timestamp() <= now_ts < end.timestamp() %}
              {% set ns.current = item.get('price', item.get('value', 0)) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.current if ns.current is not none else 0 }}
        attributes:
          prices_today: >-
            {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
            {% set target_date = now().date().isoformat() %}
            {% set ns = namespace(intervals=[]) %}
            {% for item in prices %}
              {% set start = as_local(as_datetime(item.get('start'))) %}
              {% if start and start.date().isoformat() == target_date %}
                {% set ns.intervals = ns.intervals + [{
                  'start': item.get('start'),
                  'end': item.get('end'),
                  'price': item.get('price', item.get('value', 0)) | float(0)
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.intervals }}

      - name: Stromligning Import Tomorrow
        unique_id: stromligning_import_tomorrow
        unit_of_measurement: "DKK/kWh"
        state_class: measurement
        icon: mdi:currency-dkk
        availability: >-
          {{ state_attr('sensor.energy_dashboard_peak_rates', 'prices') is not none }}
        state: >-
          {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
          {% set target_date = (now() + timedelta(days=1)).date().isoformat() %}
          {% set ns = namespace(count=0) %}
          {% for item in prices %}
            {% set start = as_local(as_datetime(item.get('start'))) %}
            {% if start and start.date().isoformat() == target_date %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          prices_tomorrow: >-
            {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
            {% set target_date = (now() + timedelta(days=1)).date().isoformat() %}
            {% set ns = namespace(intervals=[]) %}
            {% for item in prices %}
              {% set start = as_local(as_datetime(item.get('start'))) %}
              {% if start and start.date().isoformat() == target_date %}
                {% set ns.intervals = ns.intervals + [{
                  'start': item.get('start'),
                  'end': item.get('end'),
                  'price': item.get('price', item.get('value', 0)) | float(0)
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.intervals }}

      # Export payout derived by the price proxy. Each interval is the hourly
      # spot component less 3.75 ore supplier administration, 1.19 ore Vores
      # Elnet feed-in, and 0.53 ore Energinet balancing (all per kWh).
      - name: Stromligning Export Today
        unique_id: stromligning_export_today
        unit_of_measurement: "DKK/kWh"
        state_class: measurement
        icon: mdi:transmission-tower-export
        availability: >-
          {{ state_attr('sensor.energy_dashboard_peak_rates', 'prices') is not none }}
        state: >-
          {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
          {% set now_ts = now().timestamp() %}
          {% set ns = namespace(current=none) %}
          {% for item in prices %}
            {% set start = as_datetime(item.get('start')) %}
            {% set end = as_datetime(item.get('end')) %}
            {% if start and end and start.timestamp() <= now_ts < end.timestamp() %}
              {% set ns.current = item.get('export_price', 0) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.current if ns.current is not none else 0 }}
        attributes:
          prices_today: >-
            {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
            {% set target_date = now().date().isoformat() %}
            {% set ns = namespace(intervals=[]) %}
            {% for item in prices %}
              {% set start = as_local(as_datetime(item.get('start'))) %}
              {% if start and start.date().isoformat() == target_date %}
                {% set ns.intervals = ns.intervals + [{
                  'start': item.get('start'),
                  'end': item.get('end'),
                  'price': item.get('export_price', 0) | float(0)
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.intervals }}

      - name: Stromligning Export Tomorrow
        unique_id: stromligning_export_tomorrow
        unit_of_measurement: "DKK/kWh"
        state_class: measurement
        icon: mdi:transmission-tower-export
        availability: >-
          {{ state_attr('sensor.energy_dashboard_peak_rates', 'prices') is not none }}
        state: >-
          {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
          {% set target_date = (now() + timedelta(days=1)).date().isoformat() %}
          {% set ns = namespace(count=0) %}
          {% for item in prices %}
            {% set start = as_local(as_datetime(item.get('start'))) %}
            {% if start and start.date().isoformat() == target_date %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          prices_tomorrow: >-
            {% set prices = state_attr('sensor.energy_dashboard_peak_rates', 'prices') or [] %}
            {% set target_date = (now() + timedelta(days=1)).date().isoformat() %}
            {% set ns = namespace(intervals=[]) %}
            {% for item in prices %}
              {% set start = as_local(as_datetime(item.get('start'))) %}
              {% if start and start.date().isoformat() == target_date %}
                {% set ns.intervals = ns.intervals + [{
                  'start': item.get('start'),
                  'end': item.get('end'),
                  'price': item.get('export_price', 0) | float(0)
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.intervals }}

# Predbat helper package for the Energy Dashboard battery optimizer UI.
#
# Install to:
#   /config/packages/energy_dashboard_battery_optimizer.yaml
#
# This package assumes a standard Predbat setup with:
# - switch.predbat_active
# - switch.predbat_set_read_only
# - sensor.predbat_plan_html
# - Predbat's local plan endpoint at /api/plan_data
#
# If your Predbat entity ids differ, adjust the script targets below or
# override the matching ids in the dashboard `.env`.
#
# Do not load this together with the legacy combined
# `energy-dashboard-hakit.yaml` package.

# Exposes Predbat's structured plan to the dashboard through Home Assistant.
# Replace PREDBAT_HOST with the hostname or LAN address of the Predbat service.
rest:
  - resource: "http://PREDBAT_HOST:5052/api/plan_data"
    scan_interval: 300
    sensor:
      - name: Energy Dashboard Predbat Plan
        unique_id: energy_dashboard_predbat_plan
        icon: mdi:battery-clock-outline
        value_template: "{{ value_json.plan.rows | count }}"
        json_attributes_path: "$.plan"
        json_attributes:
          - rows
          - time
          - currency_symbols
          - reason_templates

input_datetime:
  energy_dashboard_predbat_paused_until:
    name: Energy Dashboard Predbat paused until
    has_date: true
    has_time: true

script:
  energy_dashboard_predbat_refresh:
    alias: Energy Dashboard Predbat refresh
    sequence:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.predbat_plan_html
            - sensor.energy_dashboard_predbat_plan
            - sensor.predbat_status
            - sensor.predbat_recommendation
            - sensor.predbat_spot_price
            - sensor.predbat_full_buy_price
            - sensor.predbat_sell_price
            - sensor.predbat_profit_today

  energy_dashboard_predbat_apply_plan:
    alias: Energy Dashboard Predbat apply plan
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.predbat_active
      - action: switch.turn_off
        target:
          entity_id: switch.predbat_set_read_only
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.predbat_plan_html
            - sensor.energy_dashboard_predbat_plan
            - sensor.predbat_status

  energy_dashboard_predbat_pause_until_tomorrow:
    alias: Energy Dashboard Predbat pause until tomorrow
    sequence:
      - variables:
          next_midnight: >
            {{ (today_at("00:00") + timedelta(days=1)).strftime("%Y-%m-%d %H:%M:%S") }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energy_dashboard_predbat_paused_until
        data:
          datetime: "{{ next_midnight }}"
      - action: switch.turn_on
        target:
          entity_id: switch.predbat_set_read_only
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.predbat_plan_html
            - sensor.energy_dashboard_predbat_plan
            - sensor.predbat_status

automation:
  - alias: Energy Dashboard Predbat resume after pause
    id: energy_dashboard_predbat_resume_after_pause
    trigger:
      - platform: template
        value_template: >
          {% set paused_until = states('input_datetime.energy_dashboard_predbat_paused_until') %}
          {{ paused_until not in ['unknown', 'unavailable', ''] and as_timestamp(now()) >= as_timestamp(paused_until) }}
    condition:
      - condition: state
        entity_id: switch.predbat_set_read_only
        state: "on"
    action:
      - action: switch.turn_off
        target:
          entity_id: switch.predbat_set_read_only
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energy_dashboard_predbat_paused_until
        data:
          datetime: "1970-01-01 00:00:00"
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.predbat_plan_html
            - sensor.energy_dashboard_predbat_plan
            - sensor.predbat_status
    mode: single
